<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the SVG rasterizer (Sprint 006 Bug 005).

  librsvg (sharp's SVG engine) does NOT read @font-face declarations
  inside the SVG - it resolves every font-family strictly through
  fontconfig. On a host with zero installed fonts (Vercel serverless),
  every glyph therefore rendered as a hollow "tofu" box, even though
  FIX-010 embedded the fonts as base64 inside the SVG.

  This file is pointed to by the FONTCONFIG_FILE environment variable
  (set in src/server/generation/font-config.ts before any
  rasterization) and makes the .ttf files bundled in THIS directory the
  font database.

  KDL TYPOGRAPHY ROLES (docs/012 / the AAT DTP framework's locked
  five-font system). The renderer never names a typeface - it asks for
  the semantic ROLE it needs (see TYPE_ROLE in fact-layer.ts), exactly
  the way it already asks the palette for a colour role:

    KaiDisplay  -> Anton             (agency/employer identity, big callouts)
    KaiHeader   -> Oswald            (country, section bars, family headings, labels)
    KaiPosition -> Barlow Condensed  (job titles, dense role lists)
    KaiNumeric  -> Archivo Black     (vacancy counts, key numerals)
    KaiFine     -> Roboto Condensed  (address, registration, trust/legal fine print)

  KaiSans/KaiSerif remain aliased to the bundled Liberation faces: they
  are the fallback inside every role's stack, so a missing role face
  degrades to a real glyph rather than tofu.

  All bundled faces are SIL Open Font License 1.1 - see NOTICE-fonts.txt.
-->
<fontconfig>
  <!-- The bundled fonts living next to this file. -->
  <dir prefix="relative">.</dir>

  <!-- Serverless filesystems are read-only except /tmp. -->
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <!-- KDL semantic type roles -> bundled faces. -->
  <alias binding="strong">
    <family>KaiDisplay</family>
    <accept><family>Anton</family></accept>
  </alias>
  <alias binding="strong">
    <family>KaiHeader</family>
    <accept><family>Oswald</family></accept>
  </alias>
  <alias binding="strong">
    <family>KaiPosition</family>
    <accept><family>Barlow Condensed</family></accept>
  </alias>
  <alias binding="strong">
    <family>KaiNumeric</family>
    <accept><family>Archivo Black</family></accept>
  </alias>
  <alias binding="strong">
    <family>KaiFine</family>
    <accept><family>Roboto Condensed</family></accept>
  </alias>

  <!-- Legacy/base families. -->
  <alias binding="strong">
    <family>KaiSans</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="strong">
    <family>KaiSerif</family>
    <accept><family>Liberation Serif</family></accept>
  </alias>

  <!-- Any other/unknown family still resolves to a real, bundled font
       rather than tofu. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>Anton</string></test>
    <test qual="all" name="family" compare="not_eq"><string>Oswald</string></test>
    <test qual="all" name="family" compare="not_eq"><string>Barlow Condensed</string></test>
    <test qual="all" name="family" compare="not_eq"><string>Archivo Black</string></test>
    <test qual="all" name="family" compare="not_eq"><string>Roboto Condensed</string></test>
    <test qual="all" name="family" compare="not_eq"><string>Liberation Sans</string></test>
    <test qual="all" name="family" compare="not_eq"><string>Liberation Serif</string></test>
    <edit name="family" mode="append_last"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
